appId: com.deskrag.app
productName: DeskRAG
directories:
  output: dist-app
  buildResources: build
files:
  - out/**/*
  - build/**/*
  - package.json
# The Swift sidecar SHIPS. Capture reads the device timebase from
# `ax-dump --clock` and a session refuses to start without it, so a packaged app
# that could not find the binary could not record at all. Before this, `files:`
# carried no sidecar and the only resolution was `ax-dump` on PATH — which is
# also why accessibility capture has been dev-only.
#
# `npm run dist` builds it first (the binary is gitignored, so a clean checkout
# has none). It is listed under mac.binaries below so it is signed: an unsigned
# nested executable fails at SPAWN time under hardened runtime, not at build.
extraResources:
  - from: ../native/ax-dump
    to: ax-dump
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Microphone capture runs in a spawned ffmpeg, so the grant has to belong to
  # the bundle: without the usage string macOS never shows the prompt, and
  # without audio-input (inherited by children) ffmpeg's avfoundation input
  # fails with "Input/output error" under Hardened Runtime.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The sidecar is a nested executable, so it must be signed in its own right —
  # hardened runtime refuses to spawn an unsigned one, and that failure appears
  # at RUN time, never at build time. Like the entitlements above, this is inert
  # without a signing identity: verify with `codesign`, not by reading this file.
  binaries:
    - Contents/Resources/ax-dump
  extendInfo:
    NSMicrophoneUsageDescription: DeskRAG records microphone audio so your sessions can be transcribed and searched. Audio never leaves this machine.
    NSCameraUsageDescription: DeskRAG does not use the camera.
    NSAppleEventsUsageDescription: DeskRAG reads the accessibility tree of the focused app to make on-screen text searchable.
win:
  icon: build/icon.ico
linux:
  icon: build/icon.png
  category: Utility
